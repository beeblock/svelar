name: Core Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.21.3
      - run: npm ci --workspace=packages/svelar --workspace=packages/svelar-stripe --workspace=packages/svelar-social-auth --include-workspace-root
      - run: npm ls --all
      - run: npm run lint -w packages/svelar
      - run: npm run build
      - run: npm run test -w packages/svelar -- --maxWorkers=1 --no-file-parallelism
      - run: npm run security:audit
