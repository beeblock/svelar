version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - security
    # These compiler contracts follow our supported Node floor and reviewed TS API.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      sveltekit-tooling:
        patterns:
          - "@sveltejs/*"
          - "svelte"
          - "vite"
          - "vitest"
          - "@vitest/coverage-v8"
          - "sveltekit-superforms"
          - "formsnap"
      build-tooling:
        patterns:
          - "tsup"
          - "esbuild"
          - "typescript"
      runtime-adapters:
        patterns:
          - "bullmq"
          - "ioredis"
          - "meilisearch"
          - "@aws-sdk/*"
          - "pdfkit"
          - "exceljs"
